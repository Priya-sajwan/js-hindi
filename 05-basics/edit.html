<body style="background-color: black; color: blanchedalmond;">
    <ul class="language">
        <li>javascript</li>
    </ul>
    
</body>
<script>
    function addlanguage(langname){
      const li =   document.createElement('li')
      li.innerHTML = `${langname}`
      document.querySelector('.language').  // or   const selector = document.querySelector('.language')
       appendChild(li)                      //      selector.appendChild(li) 
      
            
    }  
    addlanguage("python")
    addlanguage("java")
//+++++++++++++++++++++ or ++++++++++++++++++++++++++=

    function addlang(lang){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(lang)) // or const text = document.createTextNode(lang)
                                                      //    li.appendChild(text)

          document.querySelector('.language').appendChild(li) //  or   const selector = document.querySelector('.language')
                                                              //        selector.appendChild(li) 
        
    }
    addlang("c++")
    addlang("js")

 const newli = document.createElement('li')
